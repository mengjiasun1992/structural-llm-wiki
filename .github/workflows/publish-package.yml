# Publishes the sllmwiki package to PyPI when a release tag v<version> is pushed (issue #145): the
# plugin installs sllmwiki==<its version> from there. Trusted publishing: PyPI trusts this workflow,
# in the pypi environment, so no token is stored; the environment can require the owner's approval.
# A version on PyPI can never be replaced, so the build checks first: the tag is the package's
# version, the tests pass, and the wheel carries every file.
name: Publish package

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    # 24.04: setup-python has no 3.9 for ubuntu-latest (26.04)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.9'  # the oldest the package supports

      - name: The tag is the package's version
        run: |
          version=$(PYTHONPATH=src python3 -c 'import sllmwiki; print(sllmwiki.__version__)')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME, but the package is $version: bump src/sllmwiki/__init__.py, or tag v$version."
            exit 1
          fi

      - name: Unit tests
        run: python3 tests/run.py

      # the wheel and the source archive; the wheel must carry every file under src/sllmwiki/
      - name: Build
        run: |
          python3 -m pip install --quiet --disable-pip-version-check build==1.2.2.post1
          python3 -m build --outdir dist .
          python3 -c "import sys, zipfile; names = set(zipfile.ZipFile(sys.argv[1]).namelist()); missing = [p for p in sys.argv[2:] if p not in names]; print('missing from the wheel:', *missing, sep='\n  ') if missing else None; sys.exit(1 if missing else 0)" \
            dist/sllmwiki-*.whl $(git ls-files src/sllmwiki | sed 's|^src/||')

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: pypi  # PyPI's trusted publisher names this environment
      url: https://pypi.org/project/sllmwiki/
    permissions:
      id-token: write  # the short-lived token PyPI checks; nothing else is granted
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
