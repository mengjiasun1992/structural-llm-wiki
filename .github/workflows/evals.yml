# Runs the behavior evals (evals/) on a Linux runner, where git works inside the
# eval sandbox, unlike Apple's git on macOS. Each run is a real Claude session
# billed to the ANTHROPIC_API_KEY secret, so this runs only when started by hand
# (Actions → Evals → Run workflow), never on a push or a pull request.
name: Evals

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'A tag to run (smoke, full, routing, …), or "all" for every case'
        default: smoke
      case:
        description: 'One case to run instead of a tag (optional)'
        default: ''
      runs:
        description: 'Runs per case (3 before a release)'
        default: '1'
      max_cost_usd:
        description: 'Stop when the run has cost this much'
        default: '5'
      model:
        description: 'The model each run uses, pinned so scores compare across runs'
        default: claude-sonnet-5-5
      threshold:
        description: 'The score every case must reach for the job to pass (0 to 1)'
        default: '1.0'
      baseline:
        description: 'Also run each case without the plugin and report the difference (with-without before a release)'
        type: choice
        options: [none, with-without]
        default: none

permissions:
  contents: read

concurrency:
  group: evals
  cancel-in-progress: false

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.9'  # the oldest the skill supports

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 20

      - name: Install Claude Code
        run: npm install --global --no-fund --no-audit @anthropic-ai/claude-code@2.1.305

      # Bash runs inside the eval sandbox, which on Linux is bubblewrap with socat
      # (code.claude.com/docs/en/plugin-evals.md, "Grant tools"); without them every run is refused
      - name: Install the sandbox
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap socat

      # Ubuntu 24.04 may restrict unprivileged user namespaces; allow them for bwrap only
      # (code.claude.com/docs/en/sandboxing.md, "Set up Linux and WSL2")
      - name: Allow bubblewrap's user namespaces
        run: |
          if [ "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null)" = "1" ]; then
            printf '%s\n' 'abi <abi/4.0>,' 'include <tunables/global>' '' \
              'profile bwrap /usr/bin/bwrap flags=(unconfined) {' '  userns,' '  include if exists <local/bwrap>' '}' \
              | sudo tee /etc/apparmor.d/bwrap > /dev/null
            sudo systemctl reload apparmor
          fi

      # the scaffolds and the runs commit; git needs a name to
      - name: Configure git
        run: |
          git config --global user.name "sllmwiki evals"
          git config --global user.email "evals@users.noreply.github.com"
          git config --global init.defaultBranch main

      - name: Run the evals
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TAG: ${{ inputs.tag }}
          CASE: ${{ inputs.case }}
          RUNS: ${{ inputs.runs }}
          MAX_COST: ${{ inputs.max_cost_usd }}
          MODEL: ${{ inputs.model }}
          THRESHOLD: ${{ inputs.threshold }}
          ABLATION: ${{ inputs.baseline }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::Add an ANTHROPIC_API_KEY secret (Settings → Secrets and variables → Actions) to run the evals."
            exit 1
          fi
          select=()
          if [ -n "$CASE" ]; then select=(--case "$CASE")
          elif [ "$TAG" != "all" ]; then select=(--tag "$TAG"); fi
          # exit 0: every case reached the threshold; 1: a case fell short or a run failed;
          # 2: a partial run (the cost ceiling was hit)
          claude plugin eval . --trust-plugin "${select[@]}" --scaffold --allow-tools Bash Write Edit \
            --runs "$RUNS" --ablation "$ABLATION" --model "$MODEL" --max-cost-usd "$MAX_COST" -j 8 \
            --threshold "$THRESHOLD" --json evals/results/results.json --no-publish --keep-temp < /dev/null

      # each run's transcript, named by the run's folder; results.json gives each run's tracePath
      - name: Collect the traces
        if: always()
        run: |
          mkdir -p evals/results/traces
          for f in /tmp/claude-eval-*/out/trace.jsonl; do
            [ -f "$f" ] && cp "$f" "evals/results/traces/$(basename "$(dirname "$(dirname "$f")")").jsonl"
          done || true

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: eval-results
          path: evals/results/
          if-no-files-found: ignore
          retention-days: 30
