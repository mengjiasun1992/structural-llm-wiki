<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <style>
    .t { font-size: 13.5px; font-weight: 700; fill: #111827; }
    .s { font-size: 11.5px; fill: #374151; }
    .k { font-size: 11px; fill: #6b7280; }
  </style>
  <defs>
    <linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#e5e7eb"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
  </defs>
  <rect width="900" height="250" rx="14" fill="#ffffff"/>
  <text x="450" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">A reading plan: each source read once, what matters most read last</text>
  <rect x="20" y="50" width="185" height="96" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/>
  <text class="t" x="112" y="74" text-anchor="middle">related narratives</text>
  <text class="s" x="112" y="94" text-anchor="middle">ungraded or medium:</text>
  <text class="s" x="112" y="110" text-anchor="middle">background, in full</text>
  <rect x="225" y="50" width="200" height="96" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text class="t" x="325" y="74" text-anchor="middle">medium-relevance sources</text>
  <text class="s" x="325" y="94" text-anchor="middle">authority C → B → A,</text>
  <text class="s" x="325" y="110" text-anchor="middle">oldest → newest</text>
  <rect x="445" y="50" width="200" height="96" rx="10" fill="#bbf7d0" stroke="#15803d" stroke-width="2"/>
  <text class="t" x="545" y="74" text-anchor="middle">high-relevance sources</text>
  <text class="s" x="545" y="94" text-anchor="middle">authority C → B → A,</text>
  <text class="s" x="545" y="110" text-anchor="middle">oldest → newest</text>
  <rect x="665" y="50" width="215" height="96" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text class="t" x="772" y="74" text-anchor="middle">narratives it builds on</text>
  <text class="s" x="772" y="94" text-anchor="middle">graded high: their wording</text>
  <text class="s" x="772" y="110" text-anchor="middle">is the freshest when relied on</text>
  <path d="M205,98 L222,98" stroke="#6b7280" stroke-width="2" marker-end="url(#r)"/>
  <path d="M425,98 L442,98" stroke="#6b7280" stroke-width="2" marker-end="url(#r)"/>
  <path d="M645,98 L662,98" stroke="#6b7280" stroke-width="2" marker-end="url(#r)"/>
  <rect x="20" y="166" width="860" height="14" rx="7" fill="url(#g)"/>
  <text class="k" x="20" y="198">read first: least attention when writing</text>
  <text class="k" x="880" y="198" text-anchor="end">read last: the strongest attention, where the answer comes from</text>
  <rect x="20" y="212" width="12" height="12" rx="2" fill="#fff7ed" stroke="#d97706"/>
  <text class="k" x="38" y="222">low relevance: abstract only · ancestor and sibling tags: noted, never read · the plan goes into the narrative's Metadata and the pull request</text>
</svg>
