<svg xmlns="http://www.w3.org/2000/svg" width="860" height="330" viewBox="0 0 860 330" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <style>
    .t { font-size: 14px; font-weight: 700; fill: #111827; }
    .s { font-size: 12px; fill: #374151; }
    .r { font-size: 12px; fill: #4b5563; }
  </style>
  <defs>
    <marker id="d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker>
  </defs>
  <rect width="860" height="330" rx="14" fill="#ffffff"/>
  <text x="330" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">query: stop at the first tier that answers</text>
  <polygon points="40,50 620,50 590,110 70,110" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text class="t" x="330" y="75" text-anchor="middle">1 · narrative abstracts</text>
  <text class="s" x="330" y="96" text-anchor="middle">one search returns the matching tags and the top abstracts; most questions stop here</text>
  <polygon points="72,116 588,116 558,176 102,176" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text class="t" x="330" y="141" text-anchor="middle">2 · one section of a narrative</text>
  <text class="s" x="330" y="162" text-anchor="middle">read by its anchor, never the whole file</text>
  <polygon points="104,182 556,182 526,242 134,242" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text class="t" x="330" y="207" text-anchor="middle">3 · the cited source section</text>
  <text class="s" x="330" y="228" text-anchor="middle">pass the citation link as is: the evidence behind a claim</text>
  <polygon points="136,248 524,248 494,308 166,308" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text class="t" x="330" y="273" text-anchor="middle">4 · sources no narrative covers yet</text>
  <text class="s" x="330" y="294" text-anchor="middle">by abstract, then one section; offers to file the answer</text>
  <line x1="660" y1="58" x2="660" y2="300" stroke="#9ca3af" stroke-width="2" marker-end="url(#d)"/>
  <text class="r" x="672" y="78">fewer tokens, faster</text>
  <text class="r" x="672" y="294">more read, only if needed</text>
  <rect x="672" y="140" width="170" height="78" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-dasharray="5 4"/>
  <text class="t" x="757" y="163" text-anchor="middle">not covered?</text>
  <text class="s" x="757" y="183" text-anchor="middle">a DRAFT answer, marked</text>
  <text class="s" x="757" y="200" text-anchor="middle">not from the wiki, and</text>
  <text class="s" x="757" y="214" text-anchor="middle">an offer to build it</text>
</svg>
