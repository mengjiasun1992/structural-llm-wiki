<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <style>
    .q { font-size: 18px; font-weight: 800; fill: #161a36; text-anchor: middle; }
    .a { font-size: 14px; fill: #4a4f6e; text-anchor: middle; }
    .ink { fill: none; stroke: #161a36; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    .gold { fill: none; stroke: #f5b544; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect width="1200" height="330" rx="18" fill="#fbf6ea"/>
  <text x="600" y="44" font-size="20" font-weight="800" fill="#161a36" text-anchor="middle">Every kind of question gets the shape that teaches it</text>

  <!-- card backs -->
  <g fill="#ffffff" stroke="#e5dcc6" stroke-width="2">
    <rect x="30" y="70" width="216" height="230" rx="16"/>
    <rect x="262" y="70" width="216" height="230" rx="16"/>
    <rect x="494" y="70" width="216" height="230" rx="16"/>
    <rect x="726" y="70" width="216" height="230" rx="16"/>
    <rect x="958" y="70" width="216" height="230" rx="16"/>
  </g>

  <!-- What is X: a term, defined in short, then precisely -->
  <g transform="translate(138 140)">
    <text x="0" y="22" font-size="40" font-weight="800" fill="#161a36" text-anchor="middle">X</text>
    <path class="gold" d="M-34 -22 C -46 -22 -46 -16 -46 -8 L -46 0 C -46 6 -49 9 -54 9 C -49 9 -46 12 -46 18 L -46 26 C -46 34 -46 40 -34 40"/>
    <path class="gold" d="M34 -22 C 46 -22 46 -16 46 -8 L 46 0 C 46 6 49 9 54 9 C 49 9 46 12 46 18 L 46 26 C 46 34 46 40 34 40"/>
  </g>
  <text class="q" x="138" y="226">What is X?</text>
  <text class="a" x="138" y="252">in short, then rigorously,</text>
  <text class="a" x="138" y="272">and its edge cases</text>

  <!-- How does X work: one example traced through the steps -->
  <g transform="translate(370 156)">
    <path class="ink" d="M-44 0 h28 M16 0 h28"/>
    <circle cx="-60" cy="0" r="14" fill="#161a36"/><text x="-60" y="5" font-size="13" font-weight="800" fill="#fbf6ea" text-anchor="middle">1</text>
    <circle cx="0" cy="0" r="14" fill="#161a36"/><text x="0" y="5" font-size="13" font-weight="800" fill="#fbf6ea" text-anchor="middle">2</text>
    <circle cx="60" cy="0" r="14" fill="#161a36"/><text x="60" y="5" font-size="13" font-weight="800" fill="#fbf6ea" text-anchor="middle">3</text>
    <path class="gold" d="M-74 -28 C -50 -52 -20 -48 -2 -26 C 20 -48 50 -52 74 -28" stroke-dasharray="2 7"/>
    <circle cx="-74" cy="-28" r="6" fill="#f5b544"/>
  </g>
  <text class="q" x="370" y="226">How does X work?</text>
  <text class="a" x="370" y="252">one real example, walked</text>
  <text class="a" x="370" y="272">through with its numbers</text>

  <!-- Principles of X: the field mapped -->
  <g transform="translate(602 144)">
    <path class="ink" d="M0 0 L -58 -26 M0 0 L -50 30 M0 0 L 56 -30 M0 0 L 58 26 M-58 -26 L -84 -8 M-50 30 L -78 44 M56 -30 L 82 -44 M58 26 L 84 10" stroke-width="3"/>
    <circle cx="0" cy="0" r="14" fill="#161a36"/>
    <g fill="#f5b544"><circle cx="-58" cy="-26" r="9"/><circle cx="-50" cy="30" r="9"/><circle cx="56" cy="-30" r="9"/><circle cx="58" cy="26" r="9"/></g>
    <g fill="#e5dcc6"><circle cx="-84" cy="-8" r="5"/><circle cx="-78" cy="44" r="5"/><circle cx="82" cy="-44" r="5"/><circle cx="84" cy="10" r="5"/></g>
  </g>
  <text class="q" x="602" y="226">Principles of X?</text>
  <text class="a" x="602" y="252">the field mapped first,</text>
  <text class="a" x="602" y="272">then each idea in brief</text>

  <!-- X or Y: the choice decided -->
  <g transform="translate(834 146)">
    <rect x="-14" y="-44" width="28" height="24" rx="6" fill="#161a36"/>
    <text x="0" y="-27" font-size="14" font-weight="800" fill="#fbf6ea" text-anchor="middle">?</text>
    <path class="ink" d="M0 -20 V -6 M0 -6 C 0 8 -50 4 -50 20 M0 -6 C 0 8 50 4 50 20" stroke-width="3"/>
    <rect x="-72" y="20" width="44" height="28" rx="8" fill="#f5b544"/><text x="-50" y="39" font-size="14" font-weight="800" fill="#161a36" text-anchor="middle">X</text>
    <rect x="28" y="20" width="44" height="28" rx="8" fill="#ffffff" stroke="#161a36" stroke-width="2.5"/><text x="50" y="39" font-size="14" font-weight="800" fill="#161a36" text-anchor="middle">Y</text>
  </g>
  <text class="q" x="834" y="226">X or Y?</text>
  <text class="a" x="834" y="252">every option compared, and</text>
  <text class="a" x="834" y="272">the rule for when each wins</text>

  <!-- What happened in X: the causes traced -->
  <g transform="translate(1066 144)">
    <path class="ink" d="M-80 10 H 80" stroke-width="3"/>
    <g fill="#161a36"><circle cx="-64" cy="10" r="7"/><circle cx="-20" cy="10" r="7"/><circle cx="24" cy="10" r="7"/></g>
    <circle cx="66" cy="10" r="10" fill="#f26d6d"/>
    <path class="gold" d="M-64 -4 C -54 -30 -30 -30 -20 -4 M-20 -4 C -10 -30 14 -30 24 -4 M24 -4 C 34 -30 56 -30 66 -6"/>
    <text x="0" y="44" font-size="12" font-weight="700" fill="#8a7f68" text-anchor="middle">because → because → so</text>
  </g>
  <text class="q" x="1066" y="226">What happened?</text>
  <text class="a" x="1066" y="252">the timeline, the chain of</text>
  <text class="a" x="1066" y="272">causes, and the lessons</text>
</svg>
