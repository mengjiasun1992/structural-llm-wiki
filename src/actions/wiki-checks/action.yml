# The checks a Structural LLM Wiki's pull requests run: the same scripts the
# skill runs, taken from this repository at run time, so a wiki keeps no copy.
#
# In the wiki's .github/workflows/wiki-checks.yml (init installs it):
#   steps:
#     - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
#     - uses: mengjiasun1992/structural-llm-wiki/src/actions/wiki-checks@v1.1.0
#
# The working directory is the wiki's checkout; the scripts are found from
# $GITHUB_ACTION_PATH (src/actions/wiki-checks/). Each step runs even when an
# earlier one failed, so one run reports every problem.

name: Structural LLM Wiki Checks
description: Check a Structural LLM Wiki's manifests, tags, narratives, diagrams, math, YAML and markdown.

runs:
  using: composite
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
      with:
        python-version: '3.x'

    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
      with:
        node-version: 20

    # wiki-check.py: Config.toml, the schema, the tag tree, files against their
    # entries, pins, attribution, the source policy (GitHub says whether the
    # repository is private, so no lookup is needed) and the generated pages.
    - name: The manifests, tags and generated pages match the files
      if: success() || failure()
      shell: bash
      env:
        PRIVATE: ${{ github.event.repository.private }}
      run: python3 "$GITHUB_ACTION_PATH/../../../plugin/skills/sllmwiki/scripts/wiki-check.py" --visibility "$([ "$PRIVATE" = true ] && echo private || echo public)"

    # narrative-format.py: each narrative against its template and the rules every narrative shares.
    - name: Narratives follow their template
      if: success() || failure()
      shell: bash
      run: python3 "$GITHUB_ACTION_PATH/../../../plugin/skills/sllmwiki/scripts/narrative-format.py"

    # book.py parse: each diagram and formula a pull request brings parses as GitHub draws it, with
    # the same mermaid.js and MathJax as the book (src/actions/release-book/vendor/), in the runner's
    # Chrome; only the base commit is fetched, to compare with
    - name: Diagrams and math parse
      if: (success() || failure()) && github.event_name == 'pull_request'
      shell: bash
      env:
        BASE: ${{ github.event.pull_request.base.sha }}
      run: |
        git fetch --quiet --depth=1 origin "$BASE"
        python3 "$GITHUB_ACTION_PATH/../../../plugin/skills/sllmwiki/scripts/book.py" parse --base "$BASE" \
          --vendor "$GITHUB_ACTION_PATH/../release-book/vendor"

    # check-yaml.py (src/tools/): every YAML file but the sources parses by the spec.
    - name: YAML is valid
      if: success() || failure()
      shell: bash
      run: |
        python3 -m pip install --quiet --disable-pip-version-check pyyaml==6.0.2
        python3 "$GITHUB_ACTION_PATH/../../tools/check-yaml.py"

    # markdownlint with this folder's .markdownlint-cli2.jsonc: the rules that catch markdown that renders wrong.
    - name: Markdown renders correctly
      if: success() || failure()
      shell: bash
      run: npx --yes markdownlint-cli2@0.13.0 --config "$GITHUB_ACTION_PATH/.markdownlint-cli2.jsonc" "**/*.md"
