# Wiki checks for an LLM wiki's pull requests: the same checks the skills run,
# taken from this repository at run time, so a wiki keeps no copy of them.
#
# In the wiki's .github/workflows/wiki-checks.yml (init installs it):
#   steps:
#     - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
#     - uses: mengjiasun1992/structural-llm-wiki/src/actions/wiki-checks@mainline
#
# The action runs from the wiki's checkout (the working directory is the wiki's
# root) and calls the skill's scripts by their path in this repository
# ($GITHUB_ACTION_PATH is src/actions/wiki-checks/). Every script reads the
# wiki's Config.toml for where the wiki keeps its files, prints its findings,
# and exits non-zero on an error, which fails the step. Warnings are printed
# but don't fail it. Each step runs even when an earlier one failed
# (success() || failure()), so one run reports every problem at once.

name: LLM wiki checks
description: Check an LLM wiki's manifests, tags.yaml, narratives, YAML and markdown.

runs:
  using: composite
  steps:
    # The scripts need Python 3.9 or later and only the standard library.
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
      with:
        python-version: '3.x'

    # markdownlint is a Node tool; the wiki's own checks are Python
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
      with:
        node-version: 20

    # wiki-check.py (design doc §4.2–§4.4, §4.7, §4.8): the bookkeeping.
    # - Config.toml is valid: paths relative, inside the repository and
    #   distinct; settings typed like their defaults (CONFIG_INVALID).
    # - tags.yaml and both manifests match their schema (lib/schema.py):
    #   required fields, no unknown or misspelled ones, value types and
    #   allowed values.
    # - The manifests and tags.yaml agree with the files: every saved source
    #   and narrative is recorded, every record points at a file that exists,
    #   sizes and MD5s are current, and a tag and its parent list each other.
    # - Narratives pinned to a source version that has since been re-ingested
    #   (NARRATIVE_SOURCE_CHANGED); stale or missing tag abstracts
    #   (TAG_ABSTRACT_STALE, TAG_ABSTRACT_MISSING).
    # - SLLMWIKI_INDICES.md and, with the Obsidian add-on, the tag pages are
    #   up to date (--fix-index rewrites them).
    # - A public wiki holds no copy of a source that isn't openly licensed
    #   (SOURCE_POLICY).
    - name: Manifests and tags.yaml match the files
      if: success() || failure()
      shell: bash
      run: python3 "$GITHUB_ACTION_PATH/../../skills/sllmwiki/scripts/wiki-check.py"

    # narrative-format.py (design doc §4.5): each narrative against its template.
    # - The template named in its Metadata exists; its required sections are
    #   there, in order, with the title patterns, flow diagrams and placement
    #   the template's header sets.
    # - The Abstract is within its word range and the body within the
    #   template's budget (BODY_LENGTH); headings of level 2 to 4 are numbered
    #   in sequence (--fix-numbering rewrites them).
    # - Citations are escaped numbered links to a saved source's section,
    #   listed under Citations; every marker used is defined in Terminology
    #   (MARKER_UNDEFINED); a draft has its banner and only a draft does.
    # - Book and Obsidian pitfalls in the narrative (--fix-style escapes them).
    # - Config.toml's template tables and the templates and guides they name
    #   are valid (TEMPLATE_CONFIG).
    - name: Narratives follow the template
      if: success() || failure()
      shell: bash
      run: python3 "$GITHUB_ACTION_PATH/../../skills/sllmwiki/scripts/narrative-format.py"

    # obsidian-check.py (design doc §4.9): the compatible-markdown rules
    # (lib/compat.py) for every markdown file outside the sources, which stay
    # verbatim, and outside the narratives, which narrative-format checks.
    # - Markdown links only: no wikilinks or embeds; paths relative to the
    #   linking file, spaces as %20, links to files rather than folders.
    # - No Obsidian-only syntax: highlights, %% comments, block IDs, inline
    #   #tags; only GitHub's five alerts as callouts.
    # - Nothing a book reads as its own syntax: bare URLs, a % starting a line,
    #   {…} ending a heading, $ before a number, single tildes, {{#include}},
    #   emoji shortcodes, MyST syntax, headings that skip a level.
    - name: Markdown renders the same on GitHub, in Obsidian and in the books
      if: success() || failure()
      shell: bash
      run: python3 "$GITHUB_ACTION_PATH/../../skills/sllmwiki/scripts/obsidian-check.py"

    # check-yaml.py (src/tools/, CI only): every YAML file in the wiki, except
    # the saved sources, parses with PyYAML. The skill reads YAML with its own
    # subset reader, so this catches syntax a stricter parser rejects.
    - name: YAML is valid
      if: success() || failure()
      shell: bash
      run: |
        python3 -m pip install --quiet --disable-pip-version-check pyyaml==6.0.2
        python3 "$GITHUB_ACTION_PATH/../../tools/check-yaml.py"

    # markdownlint with this folder's .markdownlint-cli2.jsonc: only the rules
    # that catch markdown that renders wrong or breaks. lib/config.py's layout()
    # resolves the wiki's Config.toml, so the sources (verbatim) and the
    # template skeletons are skipped wherever the wiki keeps them.
    - name: Markdown renders correctly
      if: success() || failure()
      shell: bash
      run: |
        # skip the sources (verbatim) and template skeletons wherever the wiki's Config.toml puts them
        python3 - > "$RUNNER_TEMP/md-ignores" <<'EOF'
        import os, sys
        sys.path.insert(0, os.path.join(os.environ['GITHUB_ACTION_PATH'], '..', '..', 'skills', 'sllmwiki', 'scripts'))
        from lib.config import layout
        L = layout(os.getcwd())
        print(f'#{L.ingested}/**')
        print(f'#{L.templates}/**')
        EOF
        mapfile -t ignores < "$RUNNER_TEMP/md-ignores"
        npx --yes markdownlint-cli2@0.13.0 --config "$GITHUB_ACTION_PATH/.markdownlint-cli2.jsonc" "**/*.md" "${ignores[@]}"
