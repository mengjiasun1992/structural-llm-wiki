# Builds a Structural LLM Wiki as a book (docs/book_design.md §6.6): the skill's
# book.py stages it, draws its diagrams and math in headless Chrome with the
# libraries in vendor/, and runs Sphinx. Chrome is already on GitHub's
# runners; Sphinx and MyST-Parser are installed at their pinned versions.
#
# A wiki's release workflow (templates/release-book.yml, which init installs)
# calls it on a published release, with the release's tag: each format
# Config.toml turns on is attached to the release, and anything that went
# wrong is appended to its notes under "Known issues"; a format that fails
# doesn't stop the others. Without a release, the files are kept as a
# workflow artifact (a preview). The book's name is the repository's, and its
# cover links to the repository.

name: Structural LLM Wiki Book
description: Build a Structural LLM Wiki as a book, and keep it as a workflow artifact.

inputs:
  wiki:
    description: The wiki's folder (default, the workspace)
    default: '.'
  version:
    description: The book's version, on its cover and in its file name
    default: preview
  formats:
    description: The formats to build, comma-separated (default, the ones Config.toml turns on)
    default: ''
  release:
    description: The release to attach the files to, by its tag (default, none, a preview)
    default: ''
  name:
    description: The book's name (default, the repository's)
    default: ''
  source:
    description: The web page the cover links to as the book's source (default, the repository's)
    default: ''
  upload:
    description: Keep the files as a workflow artifact
    default: 'true'

outputs:
  html:
    description: The single-file HTML book (also built when only the PDF is asked for, which is printed from it)
    value: ${{ steps.build.outputs.html }}
  pdf:
    description: The PDF book
    value: ${{ steps.build.outputs.pdf }}
  epub:
    description: The EPUB book
    value: ${{ steps.build.outputs.epub }}
  json:
    description: The staged book's book.json (order, problems, warnings)
    value: ${{ steps.build.outputs.json }}
  seconds:
    description: How long the build took
    value: ${{ steps.build.outputs.seconds }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
      with:
        python-version: '3.x'

    - name: Install Sphinx and MyST-Parser
      shell: bash
      run: python3 -m pip install --quiet --disable-pip-version-check sphinx==9.1.0 myst-parser==5.1.0

    # the input's formats, else the ones the wiki's Config.toml turns on
    - name: Which formats
      id: formats
      shell: bash
      env:
        WIKI: ${{ inputs.wiki }}
        FORMATS: ${{ inputs.formats }}
      run: |
        if [ -z "$FORMATS" ]; then
          FORMATS=$(python3 -c 'import sys; sys.path.insert(0, sys.argv[1]); from lib import config; print(",".join(config.get(sys.argv[2]).book_formats()))' \
            "$GITHUB_ACTION_PATH/../../../plugin/skills/sllmwiki/scripts" "$WIKI")
        fi
        echo "formats=$FORMATS" >> "$GITHUB_OUTPUT"

    # the PDF is printed with these fonts, so Chinese, math and the title's 📖 print (an HTML book uses the reader's)
    - name: Fonts for the PDF
      if: contains(steps.formats.outputs.formats, 'pdf')
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq --no-install-recommends fonts-noto-core fonts-noto-mono fonts-noto-cjk fonts-noto-color-emoji > /dev/null
        fc-cache -f
        fc-list : family | grep -E '^Noto (Sans|Serif)(,| CJK SC| Math| Mono|$)|Noto Color Emoji' | sort -u | head -12

    # each SVG is kept by its source and the libraries' hash, so a release draws only what changed
    - name: Restore the drawn diagrams and math
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
      with:
        path: ${{ runner.temp }}/book-svgs
        key: book-svgs-${{ github.run_id }}
        restore-keys: book-svgs-

    - name: Build the book
      id: build
      shell: bash
      env:
        WIKI: ${{ inputs.wiki }}
        VERSION: ${{ inputs.version }}
        FORMATS: ${{ steps.formats.outputs.formats }}
        NAME: ${{ inputs.name || github.event.repository.name }}
        SOURCE: ${{ inputs.source }}
        OUT: ${{ runner.temp }}/book
      run: |
        source="${SOURCE:-$GITHUB_SERVER_URL/$GITHUB_REPOSITORY}"
        start=$(date +%s)
        status=0
        python3 "$GITHUB_ACTION_PATH/../../../plugin/skills/sllmwiki/scripts/book.py" build "$OUT" --root "$WIKI" \
          --formats "$FORMATS" --vendor "$GITHUB_ACTION_PATH/vendor" --cache "$RUNNER_TEMP/book-svgs" \
          --sphinx "python3 -m sphinx" --version "$VERSION" --name "$NAME" --source "$source" || status=$?
        echo "seconds=$(( $(date +%s) - start ))" >> "$GITHUB_OUTPUT"
        echo "json=$OUT/staged/book.json" >> "$GITHUB_OUTPUT"
        echo "status=$status" >> "$GITHUB_OUTPUT"
        for ext in html pdf epub; do
          if [ -f "$OUT/$NAME-$VERSION.$ext" ]; then echo "$ext=$OUT/$NAME-$VERSION.$ext" >> "$GITHUB_OUTPUT"; fi
        done

    # each built file goes to the release, and what went wrong to its notes
    - name: Attach the book to the release
      if: inputs.release != '' && steps.build.outputs.json != ''
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ inputs.release }}
        WIKI: ${{ inputs.wiki }}
        BOOK_JSON: ${{ steps.build.outputs.json }}
      run: |
        python3 -c "import json, sys; print('\n'.join(json.load(open(sys.argv[1])).get('files', {}).values()))" "$BOOK_JSON" |
          while read -r file; do [ -n "$file" ] && gh release upload "$TAG" "$file" --clobber; done
        issues=$(python3 "$GITHUB_ACTION_PATH/../../../plugin/skills/sllmwiki/scripts/book.py" issues "$(dirname "$BOOK_JSON")" --root "$WIKI")
        if [ -n "$issues" ]; then
          { gh release view "$TAG" --json body -q .body; printf '\n\n%s\n' "$issues"; } > "$RUNNER_TEMP/notes.md"
          gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
        fi

    - name: Keep the book as a workflow artifact
      if: inputs.upload == 'true' && inputs.release == '' && steps.build.outputs.json != ''
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
      with:
        name: book-${{ inputs.version }}
        path: |
          ${{ runner.temp }}/book/*.html
          ${{ runner.temp }}/book/*.pdf
          ${{ runner.temp }}/book/*.epub
          ${{ runner.temp }}/book/staged/book.json
        if-no-files-found: warn

    - name: Fail when a format failed
      if: steps.build.outputs.status != '0'
      shell: bash
      run: |
        echo "The book's build failed for at least one format: see the build step and the release notes."
        exit 1
