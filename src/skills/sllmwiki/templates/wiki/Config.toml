# Settings for this Structural LLM Wiki, read by the sllmwiki skill and the wiki's CI checks.
# Generated by init with the defaults; edit any value. To move a folder or
# file after the wiki has content, change it here and rerun init: it moves
# the files (git mv) and rewrites the paths and links that point at them.

# Where the wiki keeps its files: the content folder, the paths inside it, then the
# paths from the repository root.
[structural-llm-wiki-paths]
content = {{content}}                      # the content folder: the knowledge, Obsidian's vault, the books' source; "." is the repository root
# In the content folder:
ingested = {{ingested}}                    # sources, saved verbatim (images/ and files/ inside)
ingested_manifest = {{ingested_manifest}}  # source registry
groomed = {{groomed}}                      # narratives, one per question
groomed_manifest = {{groomed_manifest}}    # narrative registry
tags = {{tags}}                            # hierarchical topic tags; with the Obsidian add-on its folder also holds a page per tag
# From the repository root, outside the content folder:
index = {{index}}                          # generated map of topics and narratives, for GitHub
templates = {{templates}}                  # the files of this wiki's own narrative templates

# Settings for the sllmwiki skill.
[structural-llm-wiki-settings]
slice_large_sources = true   # save a PDF over large_source_kb one section per source, instead of refusing it
large_source_kb = 50         # a source above this size is large: sliced, and ingest asks before saving it
# Markers a narrative puts in front of what its sources don't state; "" writes no marker.
reasoning_marker = "[sllmwiki_reasoning]"   # the narrative's own reasoning, not a source's
gap_marker = "[sllmwiki_gap]"               # something the sources don't answer
# Lengths for the skill's bundled narrative templates; a template's own table
# under [structural-llm-wiki-templates] below wins over these two lines.
max_words = 0          # the body's word budget; 0 keeps each template's own
abstract_words = []    # the Abstract's range, such as [150, 300]; [] keeps each template's own
# Copyright: a narrative quotes its sources only briefly.
max_quote_words = 50   # the longest quotation a narrative may take from a source

# Add-ons: optional features, each in its own [structural-llm-wiki-settings.addons.<name>]
# table, off by default.

# Obsidian add-on, for reading this wiki as an Obsidian vault (open the content
# folder as a vault). enabled = true generates a page per tag next to tags.yaml, a header
# with each narrative's tags, and, once, the default graph settings
# (.obsidian/graph.json). Rerun init after changing these.
[structural-llm-wiki-settings.addons.obsidian]
enabled = false        # true turns the add-on on
show_sources = false   # true: the default graph shows sources, in grey; false hides them
vault = "content"      # the folder you open in Obsidian: "content" (the content folder) or "root"

# Sphinx book add-on: this wiki built as a book at release time, with Sphinx and
# MyST-Parser, attached to a GitHub Release. Planned: enabled must stay false until it
# exists.
[structural-llm-wiki-settings.addons.sphinx]
enabled = false                     # true turns the add-on on
formats = ["html", "epub", "pdf"]   # any of html, epub, pdf

# mdBook book add-on: the same book built with mdBook, lighter and HTML-first.
# Planned: enabled must stay false until it exists.
[structural-llm-wiki-settings.addons.mdbook]
enabled = false                     # true turns the add-on on
formats = ["html", "pdf"]           # any of html, pdf

# Narrative templates: which ones this wiki offers, and its own. The skill bundles
# concept_brief_overview, technical_brief_overview, decision_record, comparison and
# survey. List what this wiki offers with: python3 <skill>/scripts/narrative-format.py --templates
[structural-llm-wiki-templates]
# default = "technical_brief_overview"   # template for narratives that name none
# exclude = ["comparison"]               # bundled templates not offered for new narratives

# One table per template you customize; paths are from the repository root.
# A bundled template with this wiki's lengths (no files copied):
#   [structural-llm-wiki-templates.technical_brief_overview]
#   max_words = 3000
#   abstract_words = [150, 300]
# A bundled template with this wiki's own guide:
#   [structural-llm-wiki-templates.survey]
#   guide = "{{templates_dir}}/survey/guide.md"

# A template of this wiki's own: edit it, or copy its folder to start another.
# template.md has a YAML header naming its sections, then the skeleton the narrative step
# fills in; guide.md is its writing guide (Audience and purpose, Voice and tone,
# Structure, Formats, Evidence, Length, Checklist).
[structural-llm-wiki-templates.topic_research_record]
template = "{{templates_dir}}/topic_research_record/template.md"
guide = "{{templates_dir}}/topic_research_record/guide.md"
max_words = 1500              # the body's word budget, over its header's
abstract_words = [150, 250]   # the Abstract's range, in words
