# This wiki's settings, read by the sllmwiki skill and the wiki's CI. Every
# setting has a default: remove a line to use it. Rerun /sllmwiki:init after a
# plugin update to add settings this file doesn't have yet.

[structural-llm-wiki-settings]
# The source policy: "allow" keeps reference copies in a private wiki and only
# openly licensed sources in a public one; "links-only" keeps no copies at all.
source_copies = "allow"
max_quote_words = 50        # the longest quotation a narrative may take from a source
smes_exclude = []           # never listed as SMEs, such as this wiki's owner or bots: ["@alice", "dependabot"]
markers = true              # false: no [→] or [?] markers in narratives
images = true               # false: diagrams in mermaid only, no generated figures
language = "en"             # narratives' language, such as "zh-Hans"; sources keep their own

# A template's word budgets, over its own. For example:
# [structural-llm-wiki-templates.technical_brief_overview]
# max_words = 3000
# abstract_words = [150, 300]

[structural-llm-wiki-addons]
obsidian = false            # true: set the wiki up to open sllmwiki/ as an Obsidian vault (rerun /sllmwiki:init)

# The book a release attaches, each format turned on on its own (/sllmwiki:release builds it).
[structural-llm-wiki-release]
pdf_book = true             # a PDF: share, print, read anywhere
epub_book = false           # an EPUB: e-readers and phones
html_book = false           # one self-contained HTML file, for a browser
title = ""                  # the book's title, on its cover and in readers' libraries; empty: the repository's name
author = ""                 # its author; empty: the title
