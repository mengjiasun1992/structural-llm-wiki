# The sllmwiki package (src/sllmwiki/), which the plugin installs and runs as `sllmwiki <command>`,
# and the lint and coverage configuration for it and src/tools/.
# The scripts use only the standard library and support Python 3.9.

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sllmwiki"
dynamic = ["version"]
description = "The Structural LLM Wiki's commands: what the sllmwiki Claude Code plugin runs to keep a wiki of cited narratives in git."
readme = "README.md"
requires-python = ">=3.9"
license = "GPL-3.0-or-later AND MIT-0"  # the code; the templates (src/sllmwiki/templates/LICENSE)
license-files = ["LICENSE", "NOTICE", "src/sllmwiki/templates/LICENSE"]
authors = [{ name = "Mengjia Sun" }]
dependencies = []  # the standard library only
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Environment :: Console",
  "Topic :: Documentation",
]

[project.urls]
Homepage = "https://github.com/mengjiasun1992/structural-llm-wiki"
Documentation = "https://github.com/mengjiasun1992/structural-llm-wiki/blob/mainline/docs/manual.md"
Issues = "https://github.com/mengjiasun1992/structural-llm-wiki/issues"

[project.scripts]
sllmwiki = "sllmwiki.cli:main"

[tool.setuptools.dynamic]
version = { attr = "sllmwiki.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["sllmwiki*"]

[tool.setuptools.package-data]
# the templates: what init installs (dotfiles included), the narrative templates and language packs, the book's
sllmwiki = ["templates/**/*", "templates/**/.*", "templates/**/.*/*", "templates/**/.*/**/*"]

[tool.ruff]
target-version = "py39"
line-length = 200

[tool.ruff.lint]
# pyflakes and pycodestyle errors (the defaults), plus bugbear for likely bugs.
select = ["E4", "E7", "E9", "F", "B"]
# E741 (ambiguous name): the scripts name a line `l` throughout, by convention.
ignore = ["E741"]

[tool.coverage.run]
# Line coverage of the skill's scripts; the tests live in tests/.
source = ["src/sllmwiki"]
omit = ["*/__init__.py"]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true
